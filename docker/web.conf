server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        add_header X-Stand-Service web always;
        return 200 "ok\n";
    }

    location ^~ /delivery/ {
        proxy_pass http://wasm-delivery:8080/;
        add_header X-Stand-Gateway web always;
    }

    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Stand-Service web always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Stand-Service web always;
        try_files $uri $uri/ =404;
    }
}

