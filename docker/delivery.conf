server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type text/plain;
        add_header X-Stand-Service wasm-delivery always;
        return 200 "ok\n";
    }

    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Stand-Service wasm-delivery always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Stand-Service wasm-delivery always;
        try_files $uri =404;
    }
}
